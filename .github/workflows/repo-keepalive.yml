name: Repository Keepalive

# GitHub은 저장소에 60일간 활동이 없으면 스케줄 워크플로우(cron)를 자동 비활성화한다.
# main 브랜치에 "PR 필수" 보호 규칙이 있어 GITHUB_TOKEN으로 직접 커밋/push할 수 없으므로,
# 커밋 대신 GitHub API로 스케줄 워크플로우들을 다시 enable 호출해 60일 비활성 타이머를 리셋한다.
# (liskin/gh-workflow-keepalive 와 같은 방식)

on:
  schedule:
    - cron: '0 0 1 * *'   # 매월 1일 00:00 UTC
  workflow_dispatch:        # GitHub Actions 탭에서 수동 실행 가능

permissions:
  actions: write

jobs:
  keepalive:
    name: Re-enable scheduled workflows
    runs-on: ubuntu-latest

    steps:
      - name: Re-enable workflows via API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for wf in keep-supabase-alive.yml repo-keepalive.yml; do
            echo "Re-enabling $wf"
            gh api -X PUT "repos/$REPO/actions/workflows/$wf/enable"
          done
          gh api "repos/$REPO/actions/workflows" --jq '.workflows[] | "\(.name): \(.state)"'
